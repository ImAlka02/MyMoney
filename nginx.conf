server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Estos archivos no se guardan en caché para que las actualizaciones lleguen
    location = /sw.js         { add_header Cache-Control "no-cache"; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # CSS, JS e íconos: caché corta (el service worker se encarga del modo offline)
    location ~* \.(css|js|png|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
